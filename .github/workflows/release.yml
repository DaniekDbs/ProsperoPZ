name: Release
# Push a tag like v0.1.0-alpha (or run manually) to build and publish a pre-release.
# The PS5 app and launcher are built here; the Wine/Java/Zink runtime is reused
# unchanged from ProsperoMC's public release (see scripts/rebase-runtime-release.py).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v0.1.0-alpha)
        required: true
      upstream_tag:
        description: ProsperoMC release that supplies the runtime
        default: Prospero-Alpha
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      UPSTREAM_REPO: Ayoubec/ProsperoMC
      UPSTREAM_TAG: ${{ github.event.inputs.upstream_tag || 'Prospero-Alpha' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 wget unzip make
          pip install pillow
      - name: Build launcher backend
        run: bash scripts/build-launcher.sh
      - name: Backend tests
        run: python3 -m unittest tests.launcher.test_launcher -v
      - name: Frontend tests
        run: bash tests/frontend/run.sh
        env:
          HOST_CC: clang
      - name: Build PS5 title
        run: bash scripts/build-ps5.sh
      - name: Build /data elevation helper (PPSA99777)
        id: helper
        continue-on-error: true
        run: |
          bash scripts/build-lapy-helper.sh
          echo "built=1" >> "$GITHUB_OUTPUT"
      - name: Fetch ProsperoMC runtime package
        run: |
          mkdir -p artifacts/upstream
          asset=$(gh release view "$UPSTREAM_TAG" -R "$UPSTREAM_REPO" --json assets \
            --jq '.assets[].name | select(endswith(".zip") and (contains("update") | not))' | head -n1)
          if [ -z "$asset" ]; then echo "No install .zip in $UPSTREAM_REPO $UPSTREAM_TAG" >&2; gh release view "$UPSTREAM_TAG" -R "$UPSTREAM_REPO" --json assets; exit 1; fi
          echo "Using $UPSTREAM_REPO $UPSTREAM_TAG / $asset"
          gh release download "$UPSTREAM_TAG" -R "$UPSTREAM_REPO" -p "$asset" -D artifacts/upstream
          echo "UPSTREAM_ASSET=$asset" >> "$GITHUB_ENV"
      - name: Build install tree on the ProsperoMC runtime
        run: |
          helper_args=""
          if [ -f build/lapy/lapy.elf ] && [ -f build/lapy/lapy-manifest.json ]; then
            echo "Bundling the PPSA99777 /data helper"
            helper_args="--helper build/lapy/lapy.elf --helper-manifest build/lapy/lapy-manifest.json"
          else
            echo "::warning::No /data helper was built; the package will need /data granted by the loader"
          fi
          python3 scripts/rebase-runtime-release.py --upstream "artifacts/upstream/$UPSTREAM_ASSET" \
            --upstream-label "ProsperoMC $UPSTREAM_TAG ($UPSTREAM_ASSET)" $helper_args
      - name: Package
        run: |
          python3 scripts/package-release.py --version "$TAG"
          cp artifacts/launcher/prosperopz-launcher.jar "artifacts/releases/$TAG/"
          cp scripts/import-zomboid.py "artifacts/releases/$TAG/"
          cd "artifacts/releases/$TAG" && sha256sum prosperopz-launcher.jar import-zomboid.py >> SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish pre-release
        run: |
          {
            cat docs/releases/alpha.md
            echo
            echo "## Downloads"
            echo
            echo "- \`ProsperoPZ-$TAG.zip\`: first install. Copy \`PPSA99777\` to \`/data/homebrew/PPSA99777\` and \`prosperopz\` to \`/data/ProsperoPZ\`."
            echo "- \`ProsperoPZ-$TAG-update.zip\`: app/runtime update that keeps your games, profiles and worlds."
            echo "- \`import-zomboid.py\`: sends your own Project Zomboid install, mods and saves to the PS5."
            echo
            echo "The Wine, Zink and Java 8 runtime is reused unchanged from ProsperoMC \`$UPSTREAM_TAG\`."
            if [ -f build/lapy/lapy.elf ]; then
              echo "Includes a \`/data\` elevation helper built for PPSA99777 (same mechanism as ProsperoMC, recompiled for this title's id). It has **not** been tested on a console by the build; the Lapy source lists firmware 12.02 as validated. If ProsperoMC works on your console, this should too, but test carefully and report back."
            else
              echo "**No \`/data\` elevation helper is included in this build** — your loader must already grant \`/data\` to the app, or it will fail to start."
            fi
          } > release-notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "ProsperoPZ $TAG (experimental)" \
            --notes-file release-notes.md artifacts/releases/"$TAG"/*.zip artifacts/releases/"$TAG"/SHA256SUMS.txt \
            artifacts/releases/"$TAG"/prosperopz-launcher.jar artifacts/releases/"$TAG"/import-zomboid.py
